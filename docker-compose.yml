services:
  filingdesk:
    build: .
    image: filingdesk:0.1.0
    container_name: filingdesk
    restart: unless-stopped

    # Bound to loopback on purpose. Caddy terminates TLS and is the only
    # thing that talks to this port.
    ports:
      - "127.0.0.1:8088:8000"

    environment:
      FD_ROOT: /data
      FD_VAULT_DIR: /vault
      FD_LOG_FORMAT: json
      SEC_USER_AGENT: ${SEC_USER_AGENT:?set SEC_USER_AGENT in .env}

      # One endpoint, OpenAI-compatible, defaulting to the homelab LiteLLM
      # proxy — so the only thing this deployment has to be told is the key.
      # There is no Ollama here any more: it lived on the host because CPU
      # inference gains nothing from a container, and it served a 7B model
      # where the proxy serves a 120B one.
      # Over the tailnet: a container resolves MagicDNS but not the LAN's
      # internal .casa zone, so the name that works from a workstation fails
      # in here. Set FD_LLM_BASE_URL in .env for a host that is not on the
      # tailnet — it is the same proxy either way.
      FD_LLM_BASE_URL: ${FD_LLM_BASE_URL:-https://litellm.end-toad.ts.net/v1}
      # Empty is safe: _headers() sends no Authorization when it is falsy,
      # which is what a keyless local endpoint (vLLM, LM Studio) wants.
      # Interpolated from .env, never written into this file: .env is
      # gitignored and this is not.
      FD_LLM_API_KEY: ${FD_LLM_API_KEY:-}
      # `-` not `:-`: substitute only when the variable is ABSENT from .env,
      # not when it is present and empty. An empty FD_CHAT_MODEL is a real
      # setting — it is how dashboard-only mode is selected — and `:-` would
      # overwrite it with a model name and re-enable /ask against the user's
      # stated intent. Same for the embedding model, which is empty on the
      # default endpoint because it serves chat only.
      FD_CHAT_MODEL: ${FD_CHAT_MODEL-}
      FD_EMBED_MODEL: ${FD_EMBED_MODEL-}
      # Latency/accuracy dial — see config.py for the measured tradeoff.
      FD_REASONING_EFFORT: ${FD_REASONING_EFFORT-medium}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Filings cache, vault index, history, eval runs. Survives rebuild
      # and rollback — see deploy.md.
      - filingdesk-data:/data
      # The brain vault, read-only. Indexed into /data/vault.db.
      - ${FD_VAULT_HOST:?set FD_VAULT_HOST in .env}:/vault:ro

    # verify-reboot.sh reads these with `journalctl CONTAINER_TAG=filingdesk`.
    logging:
      driver: journald
      options:
        tag: filingdesk

volumes:
  filingdesk-data:
